# 本地试跑用的叠加层：把站点与后台映射到高位端口，避开 80/443 需要的 root。
#   docker compose -f deploy/compose.yaml -f deploy/compose.local.yaml up -d
services:
  proxy:
    ports:
      - "8443:8443"
      - "8444:8444"
    # astro.config 的 base 不是 '/'（现在 Pages 用的是 /idmt）时换这份配置，
    # 否则首页自己引用的 /idmt/_astro/*.css 会全部 404（详见 site/Caddyfile.idmt 抬头说明）：
    # command: ["caddy", "run", "--config", "/etc/caddy/site/Caddyfile.idmt", "--adapter", "caddyfile"]
