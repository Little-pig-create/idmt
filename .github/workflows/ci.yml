name: CI

on:
  push:
    branches: [main]
  pull_request:

# 门禁说明：
#   1. build —— 内容 schema 与页面编译必须通过（内容写错会在这里失败）
#   2. audit —— 扫 dist/ 校验无障碍 / SEO / 结构化数据 / 内部链接 / 体积预算
#   3. taste —— 扫 dist/ 校验设计品位（破折号清零、眉标签克制、圆角尺度单一）
#   4. contrast —— 解析 tokens.css 校验文字色对比度（全部 >= 4.5:1）
#   5. docs:tokens —— 反查文档引用的令牌是否都存在（防文档与令牌漂移）
#   6. smoke —— 起预览服务后跑 HTTP 断言
# 任意一个非零退出即视为失败。本地等价命令：
#   npm run build && npm run audit && npm run taste && npm run contrast && npm run docs:tokens && npm run smoke
#
# verify 全绿后，main 的 push 才进 deploy job，把 dist/ 发到 GitHub Pages。
# 部署前缀（Astro base = /idmt）决定线上地址是 little-pig-create.github.io/idmt/；
# 源码里的根绝对路径必须经 src/lib/paths.ts 的 u() 加前缀，audit 的 LINK-003 会盯住漏网的。
#
# 另有一项**提示级**检查，不参与上面的失败判定：
#   fonts:check —— 比对 dist 渲染字符与字体子集字符表，报出未覆盖的用字。
#   重生成子集要 41 MB 源字体 + python 工具链，不是改内容的人能做的，
#   所以新用字只提示、不卡发布（未覆盖的字会回退到系统字体，不会变豆腐块）。
jobs:
  verify:
    name: 构建 · 审计 · 冒烟
    runs-on: ubuntu-latest
    # upload-pages-artifact 要签 Pages 部署令牌，缺这两项会 403
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建静态站点
        run: npm run build

      # 静态扫描，不需要起服务
      - name: a11y / SEO / 链接 / 体积审计
        run: npm run audit

      - name: 设计品位门禁（破折号 / 眉标签 / 圆角尺度）
        run: npm run taste

      - name: 色彩对比度门禁（WCAG AA）
        run: npm run contrast

      - name: 文档 / 令牌一致性门禁
        run: npm run docs:tokens

      - name: 字体子集覆盖度检查（提示级，不阻断）
        run: npm run fonts:check

      - name: 冒烟测试（HTTP 断言）
        run: |
          # 预览服务挂在部署前缀下（项目站是 /<repo>/），根路径会 404；
          # 前缀从 astro.config.mjs 反解，避免 CI 里再抄一份。
          BASE=$(node -e "import('./scripts/config.mjs').then(m => process.stdout.write(m.readSiteConfig(process.cwd()).base))")
          npm run preview &
          PREVIEW_PID=$!
          # 等服务就绪，不用额外的 wait-on 依赖
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:4321${BASE}/" > /dev/null; then
              echo "预览服务已就绪"
              break
            fi
            sleep 1
          done
          npm run smoke
          kill $PREVIEW_PID

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          # 该动作默认取 _site，Astro 的静态输出目录是 dist
          path: dist

  # 只有 main 分支的 push 才发布；PR 与其他分支跑完门禁即止。
  # Pages 的构建来源必须是「GitHub Actions」（仓库 Settings → Pages → Source），
  # 否则 deploy-pages 会 404。
  deploy:
    name: 发布到 GitHub Pages
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4

  admin:
    name: 内容发布后台构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm ci
        working-directory: admin

      - name: 构建后台
        run: npm run build
        working-directory: admin
