name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 门禁：
#   1. build    —— 内容 schema 与页面编译（内容写错在这里失败）
#   2. audit    —— 无障碍 / SEO / 结构化数据 / 内部链接 / 体积预算
#   3. taste    —— 设计品位（内联样式、硬编码颜色、圆角尺度、alt）
#   4. contrast —— 令牌色彩对比度（WCAG AA）
#   5. smoke    —— 产物路由、详情页、检索索引与静态资源
#   6. admin    —— 后台独立构建（防止后台改动悄悄破坏）
#
# 本地等价：npm run build && npm run audit && npm run taste && npm run contrast && npm run smoke
jobs:
  site:
    name: 站点 · 构建与门禁
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建静态站点
        run: npm run build

      - name: a11y / SEO / 链接 / 体积审计
        run: npm run audit

      - name: 设计品位门禁
        run: npm run taste

      - name: 色彩对比度门禁
        run: npm run contrast

      - name: 产物冒烟
        run: npm run smoke

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  admin:
    name: 后台 · 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: 安装后台依赖
        run: npm ci --prefix admin

      - name: 构建后台
        run: npm run build --prefix admin

  deploy:
    name: 部署 · GitHub Pages
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [site, admin]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
